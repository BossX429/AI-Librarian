name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Windows-only requirements (when on Windows)
        if: runner.os == 'Windows'
        run: |
          pip install -r logger/requirements.txt

      - name: Install dev/test tools
        run: |
          pip install pytest

      - name: Run tests
        run: |
          pytest -q
